{% extends "layout.html" %}
{% block title %}Sign In{% endblock %}
{% block body %}
  <h2>Log In</h2>
  {% if error %}<div class="error"><strong>Error:</strong> {{ error }}</div>{% endif %}
  <form action="/api/login" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">   
    <dl>
      <dt><label for="login-username">Username:</label></dt>
      <dd><input id="login-username" type="text" name="username" size="30" value="{{ request.form.username }}"></dd>
      <dt><label for="login-password">Password:</label></dt>
      <dd><input id="login-password" type="password" name="password" size="30"></dd>
    </dl>
    <div class="actions">
      <input type="submit" id="login-button" value="Log In">
    </div>
  </form>
{% endblock %}
